spring:
  application:
    name: memsto
  autoconfigure:
    # Users come from our own table; skip Spring's in-memory user with a generated password.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:memsto}
    username: ${DB_USER:memsto}
    password: ${DB_PASSWORD:memsto}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

storage:
  endpoint: ${S3_ENDPOINT:http://localhost:8333}
  region: ${S3_REGION:us-east-1}
  bucket: ${S3_BUCKET:memsto}
  access-key: ${S3_ACCESS_KEY:devaccesskey}
  secret-key: ${S3_SECRET_KEY:devsecretkey}
  # Dev convenience: create the bucket on startup. Never enable against R2.
  create-bucket: ${STORAGE_CREATE_BUCKET:false}

auth:
  # HS256 signing key, at least 32 bytes. The dev default is overridden (and required) in prod.
  jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  token-ttl: ${AUTH_TOKEN_TTL:30d}
  cookie-name: memsto_session
  cookie-secure: ${AUTH_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
spring:
  config:
    activate:
      on-profile: prod
storage:
  region: ${S3_REGION:auto}
auth:
  jwt-secret: ${JWT_SECRET}
  cookie-secure: ${AUTH_COOKIE_SECURE:true}
